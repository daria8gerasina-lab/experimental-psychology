<script>
const DATA={"texts": [{"id": "A", "title": "Городская библиотека", "content": "В одном из городских районов открылась небольшая общественная библиотека. Её разместили на первом этаже бывшего административного здания, рядом с остановкой и продуктовым магазином. При подготовке помещения сотрудники решили отказаться от высоких закрытых шкафов. Книги расставили на невысоких стеллажах, а возле окон поставили столы для чтения. В библиотеке предусмотрели отдельную зону для тихой работы и несколько мест для групповых занятий.\n\nВ первые недели посетители чаще всего приходили за художественной литературой. Постепенно сотрудники заметили, что многие люди интересуются также справочниками, журналами и материалами для изучения иностранных языков. Тогда библиотека организовала тематические полки и небольшие встречи, на которых читатели могли обмениваться рекомендациями. По субботам появились занятия по поиску информации в электронных каталогах.\n\nЧерез несколько месяцев администрация провела опрос посетителей. Большинство участников отметили удобное расположение библиотеки и спокойную атмосферу. Часть читателей попросила увеличить количество розеток и продлить вечерние часы работы. Сотрудники решили сначала установить дополнительные розетки, а затем оценить, насколько часто люди задерживаются после шести вечера. Они также договорились повторить опрос в конце года, чтобы проверить, изменились ли привычки посетителей.", "qs": [{"q": "Где находилась библиотека?", "a": ["В здании школы", "На первом этаже бывшего административного здания", "В торговом центре"], "ok": 1}, {"q": "Что появилось по субботам?", "a": ["Занятия по поиску в электронных каталогах", "Кинопоказы", "Курсы рисования"], "ok": 0}, {"q": "Что сотрудники решили сделать в первую очередь после опроса?", "a": ["Купить больше художественных книг", "Продлить часы работы", "Установить дополнительные розетки"], "ok": 2}], "words": 166}, {"id": "B", "title": "Общественный сад", "content": "Жители нескольких соседних домов решили обустроить небольшой общественный сад на свободном участке между двором и пешеходной дорожкой. Сначала они обсудили, какие растения смогут выдерживать местные погодные условия. Одни предлагали высадить декоративные кустарники, другие хотели сделать грядки с зеленью. После совместного обсуждения участники решили разделить участок на две части и оставить свободное место для прохода.\n\nПодготовка началась ранней весной. Добровольцы убрали старые ветки, проверили состояние почвы и составили график полива. Чтобы не зависеть от присутствия одного человека, для каждой недели назначили двух ответственных. Кроме того, жители установили небольшой ящик для инструментов и повесили рядом понятную схему посадок. Все решения фиксировали в общем электронном документе.\n\nК середине лета сад стал заметно зеленее. Однако выяснилось, что часть растений получает слишком мало солнечного света из-за соседнего здания. Участники перенесли несколько контейнеров ближе к открытой дорожке, а для тенистой зоны выбрали другие виды зелени. Осенью они собрались снова и обсудили результаты первого сезона. Люди отметили, что совместные работы помогают соседям познакомиться, но требуют заранее распределять обязанности и учитывать отпуска участников.", "qs": [{"q": "Как решили организовать участок?", "a": ["Разделить на две части и оставить проход", "Засадить только кустарниками", "Построить теплицу"], "ok": 0}, {"q": "Как распределили полив?", "a": ["Поручили одному человеку", "Назначали двух ответственных на неделю", "Проводили полив только по выходным"], "ok": 1}, {"q": "Почему летом перенесли часть контейнеров?", "a": ["Их повредил дождь", "Растения мешали дорожке", "Растениям не хватало солнечного света"], "ok": 2}], "words": 165}, {"id": "C", "title": "Маршрут городской прогулки", "content": "Сотрудники культурного центра подготовили маршрут для самостоятельной прогулки по старой части города. Они хотели, чтобы участники могли увидеть несколько исторических зданий, не тратя много времени на дорогу. Для начала организаторы прошли предполагаемый путь пешком и отметили места, где удобно останавливаться небольшой группой. Особое внимание они уделили перекрёсткам, пешеходным переходам и участкам с узкими тротуарами.\n\nПервый вариант маршрута включал восемь остановок. После пробной прогулки выяснилось, что некоторые участники не успевали прочитать информационные таблички. Поэтому число остановок сократили до шести, а описание каждого объекта сделали короче. На схеме маршрута появились условные обозначения для мест отдыха, питьевой воды и общественного транспорта. Инструкцию решили выпускать в печатном и электронном виде.\n\nВо время следующего пробного прохода добровольцы оценивали не только продолжительность прогулки, но и понятность указаний. Несколько человек сообщили, что им было трудно найти начало маршрута. Организаторы добавили фотографию первой точки и заметный ориентир возле входа в парк. В итоговой версии также указали примерную длину пути и рекомендовали выбирать удобную обувь. Культурный центр планирует обновлять информацию дважды в год, поскольку некоторые участки могут временно закрываться на ремонт.", "qs": [{"q": "Сколько остановок осталось после пробной прогулки?", "a": ["Четыре", "Шесть", "Восемь"], "ok": 1}, {"q": "Что добавили для облегчения поиска начала маршрута?", "a": ["Фотографию первой точки и ориентир", "Дополнительную остановку", "Аудиозапись экскурсии"], "ok": 0}, {"q": "Как часто планируют обновлять информацию?", "a": ["Раз в месяц", "Раз в два года", "Дважды в год"], "ok": 2}], "words": 172}], "colors": [{"name": "Нейтральный серый", "hex": "#555555", "ratio": 7.46}, {"name": "Синий", "hex": "#2452A1", "ratio": 7.51}, {"name": "Красный", "hex": "#A91616", "ratio": 7.46}]};
const colorPerms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
const textPerms=[[0,1,2],[1,2,0],[2,0,1]];
let id=1, trials=[], idx=0, began=0, current=null, responses=[], startedAt='';
const root=document.getElementById('root');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=t=>t.trim().split(/\s+/).length;
function setup(){root.innerHTML=`<section class="panel"><h2>Подготовка</h2><p>Каждый участник читает три разных текста, по одному на каждый цвет. Читайте <strong>про себя</strong>, в обычном темпе. После нажатия «Закончил(а)» появятся три вопроса: возврат к тексту будет недоступен.</p><div class="warning">Исследование учебное; участие добровольное. Указывайте только код участника, без имени и контактов. Желательно проходить на одном и том же компьютере, при одинаковой яркости и масштабе 100%.</div><label>Номер участника (1–36): <input id="pid" type="number" min="1" max="36" value="1"></label><p class="small muted">Номера 1–36 задают уравновешенный план (18 сочетаний по 2 человека). Распределение номеров между людьми следует предварительно случайно перемешать.</p><button onclick="begin()">Перейти к инструкции</button></section>`}
function begin(){const x=Number(document.getElementById('pid').value); if(!Number.isInteger(x)||x<1||x>36){alert('Введите целое число от 1 до 36');return}id=x;
 const slot=(id-1)%18,c=colorPerms[Math.floor(slot/3)],t=textPerms[slot%3];trials=[0,1,2].map((p)=>({pos:p+1,color:DATA.colors[c[p]],text:DATA.texts[t[p]]}));idx=0;responses=[];
 root.innerHTML=`<section class="panel"><h2>Инструкция · P${String(id).padStart(2,'0')}</h2><p>Сейчас вы увидите текст. Читайте его внимательно, в обычном темпе. После прочтения нажмите «Закончил(а)». Затем ответьте на три вопроса без возврата к тексту. Между текстами делайте небольшую паузу.</p><p><span class="pill">3 текста</span><span class="pill">3 цвета</span><span class="pill">3 вопроса после каждого</span></p><button onclick="showText()">Начать первую пробу</button></section>`}
function showText(){const t=trials[idx];current=t;began=performance.now();root.innerHTML=`<section class="panel"><div class="muted small">Участник P${String(id).padStart(2,'0')} · Проба ${idx+1} из 3</div><h2>Прочитайте текст про себя</h2><div class="reading" style="color:${t.color.hex}">${esc(t.text.content)}</div><p><button onclick="finishRead()">Закончил(а) чтение</button></p></section>`;}
function finishRead(){if(!began)return;const time=(performance.now()-began)/1000;began=0;current.seconds=time;const t=current;let qhtml=t.text.qs.map((q,i)=>`<div class="quest"><strong>${i+1}. ${esc(q.q)}</strong><div class="options">${q.a.map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}">${esc(a)}</label>`).join('')}</div></div>`).join('');root.innerHTML=`<section class="panel"><div class="muted small">Проба ${idx+1} из 3</div><h2>Вопросы по содержанию</h2><p class="muted">Текст больше недоступен. Выберите по одному ответу.</p>${qhtml}<button onclick="submitAnswers()">Сохранить ответы</button></section>`;}
function submitAnswers(){const chosen=current.text.qs.map((q,i)=>document.querySelector('input[name="q'+i+'"]:checked')?.value);if(chosen.some(x=>x===undefined)){alert('Ответьте на все три вопроса');return}const correct=chosen.filter((a,i)=>Number(a)===current.text.qs[i].ok).length;const n=current.text.words||words(current.text.content);
 responses.push({participant:'P'+String(id).padStart(2,'0'),trial:idx+1,color:current.color.name,color_hex:current.color.hex,text_id:current.text.id,words:n,seconds:Number(current.seconds.toFixed(3)),wpm:Number((n*60/current.seconds).toFixed(2)),comprehension_correct:correct,comprehension_total:3,answers:chosen.map(x=>Number(x)+1).join('|')});idx++;
 if(idx<3)root.innerHTML=`<section class="panel"><h2>Проба завершена</h2><p>Подготовьтесь к следующему тексту. Постарайтесь сохранить обычный темп чтения.</p><button onclick="showText()">Следующая проба (${idx+1} из 3)</button></section>`;
 else complete();}
function complete(){let rows=responses.map(r=>`<tr><td>${r.trial}</td><td>${esc(r.color)}</td><td>${r.text_id}</td><td>${r.seconds}</td><td>${r.wpm}</td><td>${r.comprehension_correct}/3</td></tr>`).join('');root.innerHTML=`<section class="panel"><h2>Все три пробы завершены</h2><p>Данные сохраняются только в памяти этой страницы, а не на сервере. Скопируйте их или скачайте CSV и отправьте ответственному за обработку. <strong>Не закрывайте страницу до сохранения результатов.</strong></p><table><thead><tr><th>Проба</th><th>Цвет</th><th>Текст</th><th>Сек.</th><th>Слов/мин</th><th>Понимание</th></tr></thead><tbody>${rows}</tbody></table><p><button onclick="copyCSV()">Копировать результаты</button> <button class="secondary" onclick="exportCSV()">Скачать CSV</button> <button class="secondary" onclick="setup()">Новый участник</button></p><p id="copyStatus" class="small muted"></p><textarea id="copyFallback" style="display:none;width:100%;min-height:120px;font-size:13px" readonly></textarea><p class="small muted">Этот инструмент не проводит проверку статистической значимости; для неё необходимо объединить результаты всех 36 участников.</p></section>`;}
function buildCSV(){const cols=['participant','trial','color','color_hex','text_id','words','seconds','wpm','comprehension_correct','comprehension_total','answers'];const quote=x=>'"'+String(x).replace(/"/g,'""')+'"';const csv='\uFEFF'+cols.join(',')+'\r\n'+responses.map(r=>cols.map(c=>quote(r[c])).join(',')).join('\r\n');return csv;}
async function copyCSV(){const csv=buildCSV();const status=document.getElementById('copyStatus');try{await navigator.clipboard.writeText(csv);status.textContent='Скопировано! Вставьте результаты в Telegram или в таблицу.';}catch(e){let t=document.getElementById('copyFallback');t.style.display='block';t.value=csv;t.focus();t.select();status.textContent='Выделите текст и выберите «Скопировать».';}}
function exportCSV(){const csv=buildCSV();const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});let link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='color_reading_P'+String(id).padStart(2,'0')+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1500)}
setup();</script>
<script>
/* Persistent anonymous study collection — results API stores complete participants on server. */
const STUDY_API='https://ofmtjnvrmjvkalbhvtqd.supabase.co/functions/v1/reading-color-stats';
const PENDING_KEY='exp-psych-reading-pending-v1';
function getPending(){try{return JSON.parse(localStorage.getItem(PENDING_KEY)||'null')}catch{return null}}
function savePending(record){try{localStorage.setItem(PENDING_KEY,JSON.stringify(record))}catch{}}
function clearPending(){try{localStorage.removeItem(PENDING_KEY)}catch{}}
function fmtNumber(value,unit=''){return value===null||value===undefined?'—':Number(value).toLocaleString('ru-RU',{maximumFractionDigits:1})+unit}
window.setup=function(){
 const pending=getPending();
 root.innerHTML='<section class="panel"><h2>Подготовка</h2><p>Каждый участник читает три разных текста, по одному на каждый цвет. Читайте <strong>про себя</strong>, в обычном темпе. После завершения каждого текста будут три вопроса по содержанию.</p><div class="warning">Участие добровольное. Введите выданный организатором уникальный номер участника. Не вводите имя или телефон. Для сопоставимости результатов желательно использовать одинаковое устройство и настройки яркости.</div><label>Код участника (1–36): <input id="pid" type="number" min="1" max="36" placeholder="Например, 7" value=""></label><p class="small muted">Для каждого номера задан свой порядок цветов и текстов. Один номер можно сохранить только один раз.</p><p><button onclick="begin()">Начать эксперимент</button> <button class="secondary" onclick="showStats()">Статистика группы</button></p>'+(pending?'<div class="warning">На этом устройстве есть результат P'+String(pending.participant_code).padStart(2,'0')+', который ещё не удалось отправить.<p><button onclick="retrySave()">Повторить сохранение</button></p></div>':'')+'<p id="cloudStatus" class="muted small"></p></section>';
};
window.complete=function(){
 const rows=responses.map(r=>'<tr><td>'+r.trial+'</td><td>'+esc(r.color)+'</td><td>'+r.seconds+'</td><td>'+r.wpm+'</td><td>'+r.comprehension_correct+'/3</td></tr>').join('');
 const payload={
   participant_code:id,
   submission_id:(crypto.randomUUID?crypto.randomUUID(): '10000000-1000-4000-8000-'+String(Date.now()).slice(-12)),
   trials:responses.map(r=>({trial:r.trial,color:r.color,text_id:r.text_id,words:r.words,seconds:r.seconds,comprehension_correct:r.comprehension_correct}))
 };
 savePending(payload);
 root.innerHTML='<section class="panel"><h2>Эксперимент завершён</h2><p>Все три текста прочитаны. Результаты отправляются в общую базу.</p><div style="overflow-x:auto"><table><thead><tr><th>№</th><th>Цвет</th><th>Сек.</th><th>Слов/мин</th><th>Верно</th></tr></thead><tbody>'+rows+'</tbody></table></div><p id="cloudStatus" class="warning">Сохраняем результаты…</p><p><button onclick="retrySave()">Повторить отправку</button> <button class="secondary" onclick="showStats()">Общая статистика</button></p><p><button class="secondary" onclick="copyCSV()">Скопировать CSV</button> <button class="secondary" onclick="exportCSV()">Скачать CSV</button> <button class="secondary" onclick="setup()">На главную</button></p><p id="copyStatus" class="small muted"></p><textarea id="copyFallback" style="display:none;width:100%;min-height:120px" readonly></textarea></section>';
 sendResult(payload);
};
async function sendResult(payload){
 const status=document.getElementById('cloudStatus');
 if(status)status.textContent='Отправляем результаты…';
 try{
  const response=await fetch(STUDY_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const body=await response.json();
  if(!response.ok)throw new Error(body.error||'Ошибка '+response.status);
  clearPending();
  const current=document.getElementById('cloudStatus');
  if(current)current.textContent='✓ Результат участника P'+String(payload.participant_code).padStart(2,'0')+' сохранён в общей базе. Он уже учтён в статистике.';
 }catch(error){
  const current=document.getElementById('cloudStatus');
  if(current)current.textContent='Не удалось сохранить: '+String(error.message||error)+'. Данные сохранены на этом устройстве для повторной отправки. Не очищайте данные браузера.';
 }
}
window.retrySave=function(){
 const pending=getPending();
 if(!pending){const st=document.getElementById('cloudStatus');if(st)st.textContent='Нет результатов, ожидающих отправки.';return}
 sendResult(pending);
};
window.showStats=async function(){
 root.innerHTML='<section class="panel"><h2>Статистика исследования</h2><p>Загружаем сохранённые результаты…</p></section>';
 try{
  const response=await fetch(STUDY_API,{cache:'no-store'});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Ошибка сервера');
  const total=data.participants;
  const colors=data.by_color||[];
  const rows=colors.map(c=>'<tr><td><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:'+c.hex+';margin-right:7px"></span>'+esc(c.color)+'</td><td>'+c.n+'</td><td>'+fmtNumber(c.average_wpm)+'</td><td>'+fmtNumber(c.median_wpm)+'</td><td>'+fmtNumber(c.minimum_wpm)+'</td><td>'+fmtNumber(c.maximum_wpm)+'</td><td>'+fmtNumber(c.accuracy_percent,'%')+'</td></tr>').join('');
  const best=[...colors].filter(c=>c.average_wpm!==null).sort((a,b)=>b.average_wpm-a.average_wpm)[0];
  root.innerHTML='<section class="panel"><h2>Статистика исследования</h2><p class="small muted">Данные объединяются по всем участникам и обновляются при каждом открытии этой страницы.</p><div class="statgrid"><div class="stat"><div class="statvalue">'+total+' / '+data.goal_participants+'</div><div class="muted small">сохранённых участников</div></div><div class="stat"><div class="statvalue">'+data.total_trials+'</div><div class="muted small">прочитанных текстов</div></div><div class="stat"><div class="statvalue">'+fmtNumber(data.overall?.average_wpm)+'</div><div class="muted small">средняя скорость, слов/мин</div></div><div class="stat"><div class="statvalue">'+fmtNumber(data.overall?.accuracy_percent,'%')+'</div><div class="muted small">правильных ответов</div></div></div><h3>Сравнение цветов</h3><div style="overflow-x:auto"><table><thead><tr><th>Цвет</th><th>Проб</th><th>Среднее</th><th>Медиана</th><th>Мин.</th><th>Макс.</th><th>Понимание</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="small muted">Скорость — слов в минуту. Минимум и максимум — самые медленные и быстрые отдельные пробы, а не характеристики людей.</p>'+(total===0?'<p class="warning">Пока ни один участник не завершил и не сохранил эксперимент.</p>':(best?'<p><strong>Наибольшая средняя скорость:</strong> '+esc(best.color)+' ('+fmtNumber(best.average_wpm)+' слов/мин).</p>':''))+'<div class="warning small">Здесь показана описательная статистика. Для вывода о значимости влияния цвета нужен отдельный статистический тест (например, критерий Фридмана). Один код участника принимается только один раз, но личность участника не проверяется.</div><p><button class="secondary" onclick="showStats()">Обновить показатели</button> <button onclick="setup()">На главную</button></p></section>';
 }catch(error){
  root.innerHTML='<section class="panel"><h2>Статистика исследования</h2><p class="warning">Не удалось получить данные: '+esc(String(error.message||error))+'. Это не означает, что результатов нет.</p><p><button onclick="showStats()">Повторить</button> <button class="secondary" onclick="setup()">На главную</button></p></section>';
 }
};
setup();
</script></body></html>
